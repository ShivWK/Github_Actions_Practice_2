name: Test Project
on: push
jobs: 
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Get code
          uses: actions/checkout@v7
        - name: install NodeJS
          uses: actions/setup-node@v4
          with: 
            node-version: 22
        - name: install dependencies
          run: npm ci
        - name: Run Tests
          run: npm test
          